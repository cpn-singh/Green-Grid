services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: greengrid-backend
    restart: unless-stopped
    environment:
      - SECRET_KEY=greengrid-production-django-secret-key-2026
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - SQLITE_PATH=/app/data/db.sqlite3
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/map/stats/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greengrid-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
    driver: local
